name: Validate datasets
on:
  push:
    branches: [main, feat/faction-technology-trees]
  pull_request:
jobs:
  validate-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm run test:architecture
      - run: npm run test:snapshot
      - run: npm run test:validation-text
      - run: npm run validate
      - run: npm run test:technologies
      - run: npm run test:effect-foundation
      - run: npm run test:campaign-starts
      - run: npm run test:magic
